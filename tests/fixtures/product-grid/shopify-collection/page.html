<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shop Accessories</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "Computer Accessories"
      }
    </script>
  </head>
  <body>
    <header><nav><a href="/">Home</a><a href="/shop">Shop</a></nav></header>
    <main>
      <h1>Computer Accessories</h1>
      <section class="product-grid" data-testid="product-grid">
        <div class="product-card">
          <img src="/images/mouse.jpg" alt="Mouse" />
          <h3>Wireless Mouse</h3>
          <p class="price">$29.99</p>
          <a class="add-to-cart" href="/cart/add/1">Add to cart</a>
        </div>
        <div class="product-card">
          <img src="/images/keyboard.jpg" alt="Keyboard" />
          <h3>Mechanical Keyboard</h3>
          <p class="price">$89.99</p>
          <a class="add-to-cart" href="/cart/add/2">Add to cart</a>
        </div>
        <div class="product-card">
          <img src="/images/hub.jpg" alt="Hub" />
          <h3>USB-C Hub</h3>
          <p class="price">$49.99</p>
          <a class="add-to-cart" href="/cart/add/3">Add to cart</a>
        </div>
        <div class="product-card">
          <img src="/images/stand.jpg" alt="Stand" />
          <h3>Laptop Stand</h3>
          <p class="price">$39.99</p>
          <a class="add-to-cart" href="/cart/add/4">Add to cart</a>
        </div>
      </section>
      <nav class="pagination">
        <a href="?page=1">1</a>
        <a href="?page=2">Next</a>
      </nav>
    </main>
    <footer><a href="/privacy">Privacy</a></footer>
  </body>
</html>
